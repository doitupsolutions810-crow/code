nameOverride: ""
fullnameOverride: ""

controlPlane:
  replicaCount: 2
  image:
    repository: ghcr.io/doitupsolutions810-crow/sacp-control-plane
    digest: ""
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

service: {type: ClusterIP, port: 80}
podAnnotations:
  sacp.io/signature-required: "true"
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities: {drop: ["ALL"]}
networkPolicy: {enabled: true}
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
