name: SACP CI
on:
  pull_request:
  push:
    branches: [main, 'sacp/**']
permissions:
  contents: read
  id-token: write
  security-events: write
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -U pip pytest
      - run: pip install -r agent-runtime/requirements.txt
      - run: PYTHONPATH=. pytest -q agent-runtime/tests
  node-contracts:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: control-plane}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: node --check src/server.js
      - run: npm test
  image-and-scan:
    runs-on: ubuntu-latest
    needs: [python, node-contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t sacp-agent:test agent-runtime
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sacp-agent:test
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - uses: sigstore/cosign-installer@v3
      - run: cosign version
      - run: echo 'Production keyless signing remains human-gated.'
  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
